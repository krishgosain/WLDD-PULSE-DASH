<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WLDD Pulse Dash</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">WLDD</span>
    <span class="brand-name">PULSE DASH</span>
  </div>
  <div class="meta">
    <span id="lastUpdated">—</span>
  </div>
</header>

<div class="controlbar">
  <div class="week-picker">
    <label for="weekSelect">Week</label>
    <select id="weekSelect"></select>
  </div>
  <div class="search-box">
    <input id="searchInput" type="text" placeholder="Search all weeks — company, person, headline…" autocomplete="off" />
    <button id="searchClear" class="search-clear" hidden>&times;</button>
  </div>
</div>

<nav class="tabs" id="tabs">
  <button class="tab active" data-bucket="bucket1">Mandates &amp; Campaigns</button>
  <button class="tab" data-bucket="bucket2">M&amp;A</button>
  <button class="tab" data-bucket="bucket3">New Products</button>
  <button class="tab" data-bucket="bucket4">People Moves</button>
  <button class="tab" data-bucket="bucket5">Strategic Insights</button>
</nav>

<main id="content"><div class="empty-state">Loading Pulse Dash…</div></main>

<footer class="footer">
  <span>Internal tool — WLDD BD team. Auto-updated weekly, Monday 10:00 AM IST.</span>
</footer>

<script src="app.js"></script>
</body>
</html>
